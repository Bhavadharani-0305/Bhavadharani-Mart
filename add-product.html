<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | Bhavadharani Mart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="seller-dashboard-header">
        <h1>Bhavadharani Mart</h1>
        <p>SELLER CENTRE</p>
    </header>

    <main class="seller-dashboard">

        <h2>Add New Product</h2>
        <p>Add a new product to your marketplace.</p>

        <form id="addProductForm">

            <p>
                <label for="productName">Product Name</label><br>
                <input type="text" id="productName" required>
            </p>

            <p>
                <label for="productPrice">Price</label><br>
                <input type="number" id="productPrice" min="0.01" step="0.01" required>
            </p>

            <p>
                <label for="productQuantity">Quantity</label><br>
                <input type="number" id="productQuantity" min="0" required>
            </p>

            <p>
                <label for="productDescription">Description</label><br>
                <textarea id="productDescription" placeholder="Enter product description"></textarea>
            </p>

            <button type="submit">Add Product</button>

        </form>

        <p>
            <a href="seller-dashboard.html">Back to Seller Dashboard</a>
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
