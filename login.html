<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Login | Bhavadharani Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-box">

            <div class="login-brand">
                <span class="brand-mark">B</span>
                <div>
                    <h1>Bhavadharani Mart</h1>
                    <p>Premium marketplace</p>
                </div>
            </div>

            <div class="login-heading">
                <p class="login-label">BUYER ACCOUNT</p>
                <h2>Welcome back</h2>
                <p>Sign in to continue shopping with Bhavadharani Mart.</p>
            </div>

            <form id="buyerLoginForm">

                <div class="form-group">
                    <label for="email">Email or Phone Number</label>
                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email or phone"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="login-options">

                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">Forgot password?</a>

                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">

                <button type="button" class="social-button">
                    Continue with Google
                </button>

                <button type="button" class="social-button">
                    Continue with Apple
                </button>

            </div>

            <p class="signup-text">
                Don't have an account?
                <a href="#">Create an account</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to role selection
            </a>

            <p id="loginMessage" class="login-message"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
