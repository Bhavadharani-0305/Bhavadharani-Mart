<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Seller Profile | Bhavadharani Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="seller-dashboard">

        <section class="dashboard-welcome">
            <p>EDIT PROFILE</p>

            <h2>Edit Seller Profile</h2>

            <span>Update your seller account information.</span>
        </section>

        <section class="seller-management">

            <div class="management-card">

                <h3>Seller Information</h3>

                <label>Name</label>
                <input type="text" value="Seller">

                <br><br>

                <label>Email</label>
                <input type="email" value="seller@example.com">

                <br><br>

                <label>Store Name</label>
                <input type="text" value="Bhavadharani Mart">

                <br><br>

                <button  id="saveProfileButton">
                    Save Changes
                </button>

                <br><br>

                <a href="seller-profile.html">← Back to Seller Profile</a>

            </div>

        </section>

    </main>
<script src="script.js"></script>

</body>
</html>
