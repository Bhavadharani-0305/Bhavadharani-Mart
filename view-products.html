<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Products | Bhavadharani Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="seller-dashboard">

        <section class="dashboard-welcome">

            <p>PRODUCT MANAGEMENT</p>

            <h2>My Products</h2>

            <span>
                View and manage your products.
            </span>

        </section>


        <section class="dashboard-cards" id="productsContainer">

            <div class="dashboard-card">
                <h3>Ice Cream</h3>
                <p>₹100</p>
                <span>Quantity: 10</span>
            </div>

            <div class="dashboard-card">
                <h3>Chocolate</h3>
                <p>₹80</p>
                <span>Quantity: 20</span>
            </div>

            <div class="dashboard-card">
                <h3>Milk</h3>
                <p>₹60</p>
                <span>Quantity: 15</span>
            </div>

        </section>


        <br>

        <a href="seller-dashboard.html">
            ← Back to Seller Dashboard
        </a>

    </main>


    <script>

        const productsContainer =
            document.getElementById("productsContainer");

        const savedProduct =
            localStorage.getItem("product");

        if (savedProduct) {

            const product =
                JSON.parse(savedProduct);

            const productCard =
                document.createElement("div");

            productCard.className =
                "dashboard-card";

            productCard.innerHTML = `
                <h3>${product.name}</h3>
                <p>₹${product.price}</p>
                <span>Quantity: ${product.quantity}</span>
            `;

            productsContainer.appendChild(productCard);
        }

    </script>

</body>
</html>
